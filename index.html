<body>

<div id="boot">
  <div class="boot-inner">
    <div class="boot-logo">DANDY'S<span>HEROES</span></div>
    <div class="boot-bar"><i id="bootFill"></i></div>
  </div>
</div>

<div id="launcher" hidden>
  <div class="launcher-backdrop" aria-hidden="true"></div>
  <div class="launcher-vignette" aria-hidden="true"></div>
  <div class="launcher-card">
    <div class="launcher-console">
      <div class="launcher-topline"><span>GARDENVIEW</span><i>BACK ROOM</i></div>
      <div class="launcher-brand" aria-label="Dandy's Heroes">
        <img class="launcher-logo" src="uploads/Dandysheroes-2.png" alt="Dandy's Heroes">
      </div>
      <div class="launcher-divider" aria-hidden="true"><i></i><i></i></div>
      <div class="launcher-actions">
        <button id="launcherPlay" class="launcher-play" type="button">
          <span class="launcher-play-icon">▶</span>
          <span class="launcher-play-copy"><b>PLAY</b><small>CONTINUE</small></span>
          <strong>↵</strong>
        </button>
        <div class="launcher-secondary">
          <button id="launcherSettings" class="launcher-settings" type="button" aria-expanded="false"><span>⚙</span> SETTINGS</button>
          <small>Sound, saves, and preferences</small>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="loadScreen" hidden aria-live="polite" aria-busy="true">
  <div class="load-screen-inner">
    <div class="load-screen-kicker" id="loadKicker">NOW LOADING</div>
    <div class="load-screen-title" id="loadTitle">Preparing the stage</div>
    <div class="load-screen-cast" id="loadCast"></div>
    <div class="load-screen-bar"><i id="loadFill"></i></div>
    <div class="load-screen-row"><span id="loadMsg">Gathering props</span><b id="loadPct">0%</b></div>
  </div>
</div>

<div id="app" hidden>

  <header id="topbar">
    <div class="tb-left">
      <div class="tb-lvl"><span id="tbAcctLvl">1</span><small>MASTERY</small></div>
      <button class="profile-btn" id="accountBtn" aria-label="Open Dandy's Heroes profile"><span class="profile-avatar">🎭</span><span class="profile-label">Profile</span></button>
    </div>
    <div class="tb-right">
      <div class="res" data-res="ichor"><i><img class="currency-icon ichor-icon" src="uploads/ichor.png" alt="Ichor"></i><span id="resIchor">0</span></div>
      <div class="res" data-res="tape"><i>📼</i><span id="resTape">0</span></div>
      <div class="res" data-res="notes"><i>✦</i><span id="resNotes">0</span></div>
      <div class="res" data-res="star"><i>⭐</i><span id="resStar">0</span></div>
      <div class="res" data-res="ticket"><i>🎟</i><span id="resTicket">0</span></div>
      <div class="res raid-ticket-res" data-res="raidTicket"><i>⚡</i><span id="resRaidTicket">0</span></div>
      <div class="res" data-res="counterToken"><i>🔄</i><span id="resCounterToken">0</span></div>
    </div>
  </header>

  <main id="screen"></main>

  <nav id="navbar">
    <button data-nav="depths" aria-label="Run: Endless Depths" title="Run · Endless Depths"><i>▶</i><span><b>Run</b><small>Endless</small></span></button>
    <button data-nav="roster" aria-label="Heroes: Roster" title="Heroes · Roster"><i>🎭</i><span><b>Heroes</b><small>Roster</small></span></button>
    <button data-nav="raid" aria-label="Events: Weekly encounters" title="Events · Weekly encounters"><i>👑</i><span><b>Events</b><small>Weekly</small></span></button>
    <button data-nav="home" class="nav-main" aria-label="Home: Main hub" title="Home · Main hub"><i>⌂</i><span><b>Home</b><small>Hub</small></span></button>
    <button data-nav="crates" aria-label="Crates: Rewards" title="Crates · Rewards"><i>📦</i><span><b>Crates</b><small>Rewards</small></span></button>
    <button data-nav="events" aria-label="Daily: Tasks and orders" title="Daily · Tasks and orders"><i>📅</i><span><b>Daily</b><small>Tasks</small></span></button>
  </nav>

</div>

<div id="battle" hidden>
  <div id="stage">
    <div id="bgLayer"></div>
    <div id="floorLine"></div>
    <div id="fxBack"></div>
    <div id="unitLayer"></div>
    <div id="fxFront"></div>
    <div id="popLayer"></div>
    <div id="flash"></div>
    <div id="vignette"></div>
  </div>
  <div id="battleHud">
    <div id="hudTop">
      <div id="waveInfo"><i>📍</i><span id="waveText"></span></div>
      <div id="hudTimer"><i>⏱</i><span id="hudTimerText">3:00</span></div>
      <div id="hudBtns">
        <button id="btnSpeed"><i>1x</i></button>
        <button id="btnAuto"><i>▶</i></button>
        <button id="btnQuit"><i>✕</i></button>
      </div>
    </div>
    <div id="logBox"></div>
    <div id="allyDock"></div>
  </div>
  <div id="battleEnd" hidden></div>
</div>

<div id="modal" hidden><div id="modalBox"></div></div>
<div id="toasts"></div>

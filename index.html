<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Dandy's Heroes</title>
<script src="js/mobile-frame.js"></script>
<script src="js/perf-guard.js"></script>
<script src="js/audio-redirect.js"></script>
<link rel="icon" href="uploads/ichor.png" type="image/png">
<link rel="preload" as="image" href="uploads/launcher-room.webp">
<link rel="preload" as="image" href="uploads/Dandysheroes-2.webp">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/layers.css">
<link rel="stylesheet" href="css/dyle-radio.css">
<link rel="stylesheet" href="css/home-stage.css">
<link rel="stylesheet" href="css/rarity-aura.css">
<link rel="stylesheet" href="css/dandy-buttons.css">
<link rel="stylesheet" href="css/codebase.css">
<link rel="stylesheet" href="css/raid-ticket.css">
<link rel="stylesheet" href="css/ff7-defeat.css">
<link rel="stylesheet" href="css/friendship-qol.css">
<link rel="stylesheet" href="css/story.css">
<link rel="stylesheet" href="css/story-vfx.css">
<link rel="stylesheet" href="css/story-ch2.css">
<link rel="stylesheet" href="css/kh-vfx.css">
<link rel="stylesheet" href="css/roster-refresh.css">
<link rel="stylesheet" href="css/bottom-navigation.css">
<link rel="stylesheet" href="css/heroes-menu.css">
<link rel="stylesheet" href="css/hero-collections.css">
<link rel="stylesheet" href="css/arena-exchange.css">
<link rel="stylesheet" href="css/trials-polish.css">
<link rel="stylesheet" href="css/mods.css">
<link rel="stylesheet" href="css/ch3-expansion.css">
<link rel="stylesheet" href="css/prize-wall.css">
<link rel="stylesheet" href="css/phone.css">
<link rel="stylesheet" href="css/nugget-vn.css">
<link rel="stylesheet" href="css/toons-universe.css">
<link rel="stylesheet" href="css/dw-modded.css">
<link rel="stylesheet" href="css/almost-home.css">
<link rel="stylesheet" href="css/veteran-events.css">
<link rel="stylesheet" href="css/arena-season.css">
<link rel="stylesheet" href="css/arena-overhaul.css">
<link rel="stylesheet" href="css/battle-foregrounds.css">
<link rel="stylesheet" href="css/effekseer.css">
<link rel="stylesheet" href="css/boskers-globe.css">
<link rel="stylesheet" href="css/profile-book.css">
<link rel="stylesheet" href="css/arena-v2.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/battle-mobile.css">
<link rel="stylesheet" href="css/perf.css">
<link rel="stylesheet" href="css/qol.css">
<link rel="stylesheet" href="css/battle-phone.css">
<script src="vendor/effekseer/effekseer.min.js" defer></script>
</head>
<body>

<div id="boot">
  <div class="boot-inner">
    <div class="boot-logo">DANDY'S<span>HEROES</span></div>
  </div>
</div>

<div id="launcher" hidden>
  <div class="launcher-backdrop" aria-hidden="true"></div>
  <div class="launcher-card">
    <img class="launcher-logo" src="uploads/Dandysheroes-2.webp" alt="Dandy's Heroes" fetchpriority="high">
    <div class="launcher-actions">
      <button id="launcherPlay" class="launcher-play" type="button" disabled>Loading…</button>
      <button id="launcherSettings" class="launcher-settings" type="button" disabled>Settings</button>
      <div id="launcherStatus" class="launcher-status" role="status" aria-live="polite">Loading game…</div>
    </div>
  </div>
</div>

<div id="loadScreen" hidden aria-live="polite" aria-busy="true">
  <div class="load-curtain load-curtain-left" aria-hidden="true"></div>
  <div class="load-curtain load-curtain-right" aria-hidden="true"></div>
  <div class="load-stage-stars" aria-hidden="true"><i>✦</i><i>✦</i><i>✧</i><i>✦</i></div>
  <div class="load-screen-inner">
    <div class="load-mascot"><img src="uploads/dandyhimself.webp" alt="" draggable="false"><span>ON IN A MOMENT!</span></div>
    <div class="load-screen-kicker" id="loadKicker">NOW LOADING</div>
    <div class="load-screen-title" id="loadTitle">Preparing the stage</div>
    <div class="load-screen-cast" id="loadCast"></div>
    <div class="load-screen-bar" id="loadProgress" role="progressbar" aria-label="Loading scene assets" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-describedby="loadMsg"><i id="loadFill"></i></div>
    <div class="load-screen-row"><span id="loadMsg">Gathering props</span><b id="loadPct">0%</b></div>
    <div class="load-screen-count" id="loadCount" aria-live="polite">Waiting for props</div>
  </div>
</div>

<div id="app" hidden>

  <header id="topbar">
    <div class="tb-left">
      <div class="tb-lvl"><span id="tbAcctLvl">1</span><small>MASTERY</small></div>
      <button class="profile-btn" id="accountBtn" aria-label="Open profile"><span class="profile-avatar">🎭</span><span class="profile-label">Profile</span></button>
    </div>
    <div class="tb-right">
      <div class="res" data-res="ichor"><i><img class="currency-icon ichor-icon" src="uploads/ichor.png" alt="Ichor"></i><span id="resIchor">0</span></div>
      <div class="res" data-res="tape"><i>📼</i><span id="resTape">0</span></div>
      <div class="res" data-res="notes"><i>✦</i><span id="resNotes">0</span></div>
      <div class="res" data-res="star"><i>⭐</i><span id="resStar">0</span></div>
      <div class="res" data-res="ticket"><i>🎟</i><span id="resTicket">0</span></div>
      <div class="res raid-ticket-res" data-res="raidTicket"><i>⚡</i><span id="resRaidTicket">0</span></div>
      <div class="res" data-res="counterToken"><i>🔄</i><span id="resCounterToken">0</span></div>
    </div>
  </header>

  <main id="screen"></main>

  <nav id="navbar">
    <button data-nav="depths" aria-label="Run" title="Run"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z" fill="currentColor" stroke="none"/></svg></i><span><b>Run</b></span></button>
    <button data-nav="roster" aria-label="Heroes" title="Heroes"><i><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19v-1.5a5.5 5.5 0 0 1 11 0V19H3.5ZM16.5 5.5a3 3 0 0 1 0 5.7M17 14a4.5 4.5 0 0 1 3.5 4.4V19H17"/></svg></i><span><b>Heroes</b></span></button>
    <button data-nav="raid" aria-label="Events" title="Events"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.5 2.7 5.8 6.3.8-4.6 4.4 1.2 6.2-5.6-3-5.6 3 1.2-6.2L3 9.1l6.3-.8L12 2.5Z"/></svg></i><span><b>Events</b></span></button>
    <button data-nav="home" class="nav-main" aria-label="Home" title="Home"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-7 9 7M5.5 9.5V20h13V9.5M10 20v-6h4v6"/></svg></i><span><b>Home</b></span></button>
    <button data-nav="crates" aria-label="Crates" title="Crates"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9ZM3 7.5l9 4.5 9-4.5M12 12v9M7.5 5.25l9 4.5"/></svg></i><span><b>Crates</b></span></button>
    <button data-nav="events" aria-label="Daily" title="Daily"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7.5 3v4M16.5 3v4M3 10h18m-13 5 2.5 2.5L16 13"/></svg></i><span><b>Daily</b></span></button>
  </nav>

</div>

<div id="battle" hidden>
  <div id="stage">
    <div id="bgLayer"></div>
    <div id="floorLine" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div id="fxBack"></div>
    <div id="unitLayer"></div>
    <canvas id="effekseerLayer" aria-hidden="true"></canvas>
    <div id="fxFront"></div>
    <div id="popLayer"></div>
    <div id="flash"></div>
    <div id="vignette"></div>
  </div>
  <div id="battleHud">
    <div id="hudTop">
      <div id="waveInfo"><i>📍</i><span id="waveText"></span></div>
      <div id="hudTimer"><i>⏱</i><span id="hudTimerText">3:00</span></div>
      <div id="hudBtns">
        <button id="btnSpeed" type="button" aria-label="Battle speed" title="Battle speed"><i>1x</i></button>
        <button id="btnAuto" type="button" aria-label="Auto skills on" aria-pressed="true" title="Auto White skills"><i>AUTO</i></button>
        <button id="btnPause" type="button" aria-label="Pause battle" title="Pause battle"><i>⏸</i></button>
        <button id="btnQuit" type="button" aria-label="Leave battle" title="Leave battle"><i>✕</i></button>
      </div>
    </div>
    <div id="logBox"></div>
    <div id="allyDock"></div>
  </div>
  <div id="battleEnd" hidden></div>
</div>

<div id="modal" hidden><div id="modalBox"></div></div>
<div id="toasts"></div>

<script src="js/boot-loader.js"></script>
<script src="js/item-sheet.js"></script>
<script src="js/battle-mobile.js"></script>
</body>
</html>
